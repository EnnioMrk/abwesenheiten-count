<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Absence Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    <!-- GridStack CDN -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/gridstack@9.5.0/dist/gridstack.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/gridstack@9.5.0/dist/gridstack-extra.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/gridstack@9.5.0/dist/gridstack-all.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="js/annalyse.js"></script>
    <script src="/js/styler.js" defer></script>
    <script src="js/grid.js" defer></script>
    <script src="js/index.js" defer></script>

    <link rel="icon" href="../icon/favicon.ico" type="image/x-icon" />
    <style>
      :root {
        --color-primary: #3b82f6;
        --color-secondary: #6366f1;
        --color-background: #f8fafc;
        --color-card-bg: #ffffff;
        --color-text: #1f2937;
        --color-muted-text: #6b7280;
        --transition-speed: 0.3s;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
          0 2px 4px -1px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1),
          0 4px 6px -2px rgba(0, 0, 0, 0.05);
        --radius-md: 0.75rem;
        --radius-lg: 1rem;
        --space-xs: 0.5rem;
        --space-sm: 1rem;
        --space-md: 1.5rem;
        --space-lg: 2rem;
        --space-xl: 3rem;
      }

      body {
        background-color: var(--color-background);
        color: var(--color-text);
        font-family: "Inter", sans-serif;
        transition: background-color var(--transition-speed) ease;
        line-height: 1.6;
      }

      .summaryCard,
      .chart-container {
        background-color: var(--color-card-bg);
        color: var(--color-text);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
        transition: all var(--transition-speed) ease;
      }

      .summaryCard:hover {
        transform: translateY(-4px);
        box-shadow: var(--shadow-lg);
      }

      .chart-container:hover {
        box-shadow: var(--shadow-lg);
      }

      .section-title {
        color: var(--color-text);
        font-weight: 600;
        position: relative;
        padding-bottom: var(--space-sm);
        margin-bottom: var(--space-md);
      }

      .section-title::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 0;
        width: 40px;
        height: 3px;
        background: var(--color-primary);
        border-radius: 3px;
        transition: width 0.3s ease;
      }

      .chart-container:hover .section-title::after {
        width: 60px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .fade-in {
        animation: fadeIn 0.5s ease forwards;
        opacity: 0;
      }

      .fade-in-delay-1 {
        animation-delay: 0.1s;
      }

      .fade-in-delay-2 {
        animation-delay: 0.2s;
      }

      .fade-in-delay-3 {
        animation-delay: 0.3s;
      }

      .fade-in-delay-4 {
        animation-delay: 0.4s;
      }

      footer {
        margin-top: var(--space-xl);
        transition: background-color var(--transition-speed) ease;
        padding: var(--space-lg) 0;
      }

      .chart-wrapper {
        position: relative;
        transition: all 0.3s ease;
        padding: var(--space-md) 0;
        z-index: 1;
        border-radius: var(--radius-md);
      }

      .grid-stack-item-content {
        height: 100%;
        position: relative;
        padding: 0.5rem;
        inset: 0 !important;
        padding: 0.5rem;
      }

      .ui-resizable-n {
        top: 0.5rem !important;
        left: 0.5rem !important;
        right: 0.5rem !important;
      }

      .ui-resizable-e {
        top: 0.5rem !important;
        bottom: 0.5rem !important;
        right: 0.5rem !important;
      }

      .ui-resizable-s {
        left: 0.5rem !important;
        right: 0.5rem !important;
        bottom: 0.5rem !important;
      }

      .ui-resizable-w {
        top: 0.5rem !important;
        bottom: 0.5rem !important;
        left: 0.5rem !important;
      }

      .ui-resizable-ne {
        top: 0.5rem !important;
        right: 0.5rem !important;
        transform: rotate(45deg) !important;
      }

      .ui-resizable-se {
        right: 0.5rem !important;
        bottom: 0.5rem !important;
      }

      .ui-resizable-nw {
        top: 0.5rem !important;
        left: 0.5rem !important;
        transform: rotate(-45deg) !important;
      }

      .ui-resizable-sw {
        left: 0.5rem !important;
        bottom: 0.5rem !important;
      }
    </style>
    <style type="text/tailwind">
      @layer components {
        .stat-card {
          @apply p-5 transition-all duration-300 ease-in-out;
        }
        .chart-container {
          @apply p-6 w-full transition-all duration-300 ease-in-out;
        }
      }
    </style>
  </head>
  <body class="bg-theme-background">
    <header
      class="p-4 mb-8 bg-gradient-to-br from-theme-primary to-theme-secondary text-white shadow-md"
    >
      <div
        class="container mx-auto py-4 px-6 flex flex-col justify-between items-center sm:flex-row gap-4"
      >
        <div>
          <h1 class="text-3xl font-bold">Absence Analysis</h1>
          <p class="text-blue-100 mt-1">
            Track and analyze attendance patterns
          </p>
        </div>
        <div class="flex items-center">
          <a
            href="/recommender/"
            class="bg-theme-background-light text-theme-primary px-4 py-2 rounded-md hover:bg-theme-background-dark transition-all"
          >
            Recommender
          </a>
          <div
            class="ml-4 p-2 cursor-pointer rounded-full bg-theme-background-light hover:bg-theme-background-dark hover:rotate-12 transition-all"
            id="themeToggle"
            title="Toggle theme"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              class="size-6 stroke-theme-secondary"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"
              />
            </svg>
          </div>
          <div
            id="editToggle"
            title="Toggle edit mode"
            class="ml-4 p-2 cursor-pointer rounded-full bg-theme-background-light hover:bg-theme-background-dark hover:rotate-12 transition-all"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              class="size-6 stroke-theme-secondary"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125"
              />
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              class="size-6 stroke-theme-secondary hidden"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M6 18 18 6M6 6l12 12"
              />
            </svg>
          </div>
          <a
            id="profile"
            title="Profile"
            class="ml-4 p-1 cursor-pointer rounded-full bg-theme-background-light"
            href="/profile"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              class="size-8 stroke-theme-secondary"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main class="container mx-auto p-6 min-h-[calc(100vh-15rem)]">
      <!-- Skeleton Loading State -->
      <div
        id="skeletonLoader"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8"
      >
        <!-- Stat Card Skeletons -->
        <div class="animate-pulse bg-white rounded-lg shadow-md p-6">
          <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
          <div class="h-8 bg-gray-200 rounded w-1/2"></div>
        </div>
        <div class="animate-pulse bg-white rounded-lg shadow-md p-6">
          <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
          <div class="h-8 bg-gray-200 rounded w-1/2"></div>
        </div>
        <div class="animate-pulse bg-white rounded-lg shadow-md p-6">
          <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
          <div class="h-8 bg-gray-200 rounded w-1/2"></div>
        </div>
        <div class="animate-pulse bg-white rounded-lg shadow-md p-6">
          <div class="h-4 bg-gray-200 rounded w-3/4 mb-4"></div>
          <div class="h-8 bg-gray-200 rounded w-1/2"></div>
        </div>

        <!-- Chart Skeletons -->
        <div
          class="animate-pulse bg-white rounded-lg shadow-md p-6 md:col-span-2"
        >
          <div class="h-4 bg-gray-200 rounded w-1/4 mb-4"></div>
          <div class="h-64 bg-gray-200 rounded"></div>
        </div>
        <div
          class="animate-pulse bg-white rounded-lg shadow-md p-6 md:col-span-2"
        >
          <div class="h-4 bg-gray-200 rounded w-1/4 mb-4"></div>
          <div class="h-64 bg-gray-200 rounded"></div>
        </div>
      </div>
    </main>

    <footer class="bg-gray-800 text-white py-6">
      <div class="container mx-auto px-6">
        <div class="flex flex-col md:flex-row justify-between items-center">
          <p>© 2024 Student Absence Dashboard</p>
          <div class="flex space-x-4 mt-3 md:mt-0">
            <a href="#" class="hover:text-blue-300 transition-colors">Help</a>
            <a href="#" class="hover:text-blue-300 transition-colors"
              >Privacy</a
            >
            <a href="#" class="hover:text-blue-300 transition-colors">Terms</a>
          </div>
        </div>
      </div>
    </footer>
  </body>
</html>
