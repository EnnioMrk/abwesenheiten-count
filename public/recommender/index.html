<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Absence Recommender</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <!-- Chartist-->
        <script type="module" src="/dist/chartist/index.js"></script>
        <link rel="stylesheet" href="/dist/chartist/index.css" />
        <link rel="stylesheet" href="css/style.css" />
        <style>
            @keyframes shimmer {
                0% {
                    background-position: -1000px 0;
                }
                100% {
                    background-position: 1000px 0;
                }
            }
            .shimmer {
                background: linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.4) 50%,
                    rgba(255, 255, 255, 0) 100%
                );
                background-size: 1000px 100%;
                animation: shimmer 2s infinite linear;
            }
            .loading-overlay {
                backdrop-filter: blur(4px);
                transition: opacity 0.3s ease-in-out;
            }
            .loading-spinner {
                border-width: 3px;
                animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55)
                    infinite;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
            .skeleton-item {
                background: linear-gradient(
                    90deg,
                    var(--color-background-light) 0%,
                    var(--color-background-darker) 50%,
                    var(--color-background-light) 100%
                );
                background-size: 200% 100%;
                animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            }
            @keyframes pulse {
                0%,
                100% {
                    opacity: 1;
                }
                50% {
                    opacity: 0.5;
                }
            }
            .error-icon {
                animation: shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
            }
            @keyframes shake {
                10%,
                90% {
                    transform: translate3d(-1px, 0, 0);
                }
                20%,
                80% {
                    transform: translate3d(2px, 0, 0);
                }
                30%,
                50%,
                70% {
                    transform: translate3d(-4px, 0, 0);
                }
                40%,
                60% {
                    transform: translate3d(4px, 0, 0);
                }
            }
        </style>
        <style>
            /* Chartist custom styles for full width */
            .ct-chart {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .ct-chart svg {
                width: 100% !important;
                overflow: visible;
            }

            .ct-chart .ct-grids {
                width: 100% !important;
            }

            .ct-chart .ct-grid {
                stroke-width: 1px;
                stroke: var(--color-background-darker);
            }

            .ct-chart .ct-labels {
                color: var(--color-text);
                fill: var(--color-text);
                font-size: 12px;
            }

            .ct-chart .ct-label {
                color: var(--color-text);
                fill: var(--color-text);
            }

            .ct-chart .ct-label.ct-vertical {
                text-anchor: end;
                transform: translateX(-5px);
            }

            @media (max-width: 768px) {
                .ct-chart .ct-labels {
                    font-size: 10px;
                }
            }
        </style>
        <script type="module">
            import * as chartist from '/dist/chartist/index.js';
            window.chartist = chartist;

            window.globalChartOptions = {
                low: 0,
                onlyInteger: true,
                axisY: {
                    onlyInteger: true,
                    offset: 40,
                },
                seriesBarDistance: 10,
                reverseData: false,
                horizontalBars: true,
                chartPadding: {
                    top: 20,
                    right: 50,
                    bottom: 10,
                    left: 100,
                },
                // Responsive options
                responsive: {
                    '(max-width: 768px)': {
                        chartPadding: {
                            top: 15,
                            right: 30,
                            bottom: 5,
                            left: 80,
                        },
                    },
                },
            };
        </script>
        <!-- Include the analysis script -->
        <script src="../dashboard/js/analyze.js" defer></script>
        <script src="js/index.js" defer></script>
        <script src="/js/styler.js" defer></script>
    </head>
    <body class="bg-theme-background">
        <header
            class="p-4 mb-8 bg-gradient-to-br from-theme-primary to-theme-secondary text-white shadow-md"
        >
            <div
                class="container mx-auto py-4 px-6 flex flex-col justify-between items-center sm:flex-row gap-4"
            >
                <div>
                    <h1 class="text-3xl font-bold">Absence Recommender</h1>
                    <p class="text-blue-100 mt-1">
                        Get recommendations for your absences
                    </p>
                </div>
                <div class="flex items-center gap-4">
                    <!-- Reload Data Button -->
                    <button
                        class="flex items-center gap-2 bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg transition-all shadow-md hover:shadow-lg"
                        id="reloadDataBtn"
                        title="Reload data"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="w-4 h-4"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"
                            />
                        </svg>
                        <span class="hidden sm:inline">Reload</span>
                    </button>

                    <a
                        href="/dashboard/"
                        class="bg-theme-background-light text-theme-primary px-4 py-2 rounded-md hover:bg-theme-background-dark transition-all"
                    >
                        Dashboard
                    </a>

                    <!-- Theme Toggle -->
                    <div
                        class="p-2 cursor-pointer rounded-full bg-theme-background-light hover:bg-theme-background-dark hover:rotate-12 transition-all shadow-md hover:shadow-lg"
                        id="themeToggle"
                        title="Toggle theme"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            stroke="currentColor"
                            class="w-5 h-5 sm:w-6 sm:h-6 stroke-theme-secondary"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"
                            />
                        </svg>
                    </div>

                    <a
                        id="profile"
                        title="Profile"
                        class="p-1 cursor-pointer rounded-full bg-theme-background-light"
                        href="/profile/"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke-width="1.5"
                            class="size-8 stroke-theme-secondary"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                            />
                        </svg>
                    </a>
                </div>
            </div>
        </header>

        <div class="container mx-auto p-4 pt-0">
            <div
                class="bg-theme-background-light p-6 rounded-lg shadow-md mb-8 relative overflow-hidden"
            >
                <div
                    id="recommenderChartContainer"
                    class="relative w-full h-[500px] md:h-[600px]"
                >
                    <div
                        class="ct-chart w-full h-[calc(100%-60px)]"
                        id="recommenderChart"
                    ></div>
                </div>
            </div>

            <div class="bg-theme-background-light p-8 rounded-lg shadow-md">
                <h2 class="text-xl font-semibold mb-4 text-theme-text">
                    Recommendations
                </h2>
                <ul id="recommendationText" class="list-disc pl-5 space-y-3">
                    <!-- Recommendations will be loaded here -->
                    <li>Loading recommendations...</li>
                </ul>
            </div>
        </div>
    </body>
</html>
