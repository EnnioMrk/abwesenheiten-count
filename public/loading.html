<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loading...</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100">
    <div
      id="loadingScreen"
      class="min-h-screen flex items-center justify-center"
    >
      <div class="bg-white p-8 rounded-lg shadow-md w-96 text-center">
        <div
          class="animate-spin rounded-full h-16 w-16 border-b-2 border-indigo-600 mx-auto mb-4"
        ></div>
        <h2 class="text-xl font-semibold mb-4">Logging in...</h2>
        <div id="status" class="text-gray-600 mb-4">
          Connecting to server...
        </div>
        <div class="w-full bg-gray-200 rounded-full h-2.5">
          <div
            id="progress"
            class="bg-indigo-600 h-2.5 rounded-full"
            style="width: 0%"
          ></div>
        </div>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      let socket;
      let progressValue = 0;

      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
      }

      function connectWebSocket() {
        const sessionId = getCookie('connect.sid');
        socket = io({ query: { sessionId } });

        socket.on("progress", (data) => {
          updateStatus(data.message, data.progress);
        });

        socket.on("error", (data) => {
          console.error("Socket error:", data);
          updateStatus(data.message, null);
        });

        socket.on("disconnect", () => {
          console.log("Socket disconnected");
        });
      }

      function updateStatus(message, progress) {
        document.getElementById("status").textContent = message;
        if (progress !== undefined) {
          progressValue = progress;
          document.getElementById("progress").style.width = `${progress}%`;
        }

        if (progress === 100) {
          setTimeout(() => {
            window.location.href = "/dashboard";
          }, 1000);
        }
      }

      // Connect to WebSocket when page loads
      connectWebSocket();
    </script>
  </body>
</html>
