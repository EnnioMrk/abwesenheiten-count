<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>QR Code Login</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script
            src="https://unpkg.com/html5-qrcode"
            type="text/javascript"
        ></script>
        <script src="js/index.js" defer></script>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body class="bg-gray-100 min-h-screen p-4 md:p-6">
        <div
            class="max-w-lg mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6"
        >
            <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">
                QR Code Login
            </h1>

            <div class="flex border-b border-gray-200 mb-6">
                <button
                    class="tab-btn active py-2 px-4 font-medium text-blue-600 border-b-2 border-blue-500 focus:outline-none"
                    data-tab="upload"
                >
                    Upload QR Code
                </button>
                <button
                    class="tab-btn py-2 px-4 font-medium text-gray-500 hover:text-blue-600 focus:outline-none"
                    data-tab="scan"
                >
                    Scan QR Code
                </button>
            </div>

            <div class="tab-content active" id="upload">
                <div
                    class="upload-area border-2 border-dashed border-gray-300 rounded-lg p-8 text-center cursor-pointer hover:bg-gray-50 transition-colors relative"
                >
                    <input
                        type="file"
                        id="qr-input"
                        accept="image/*"
                        class="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                    />
                    <label
                        for="qr-input"
                        class="text-gray-500 flex flex-col items-center"
                    >
                        <svg
                            class="w-12 h-12 text-gray-400 mb-3"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                            ></path>
                        </svg>
                        Choose a QR code or drop it here
                    </label>
                </div>
            </div>

            <div class="tab-content hidden" id="scan">
                <div
                    id="qr-reader"
                    class="w-full mb-4 overflow-hidden rounded-lg"
                ></div>
                <div class="flex space-x-4">
                    <button
                        id="start-scan"
                        class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-2 px-4 rounded-lg transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50"
                    >
                        Start Camera
                    </button>
                    <button
                        id="stop-scan"
                        disabled
                        class="bg-gray-300 text-gray-500 font-medium py-2 px-4 rounded-lg cursor-not-allowed"
                    >
                        Stop Camera
                    </button>
                    <button
                        id="flip-camera"
                        class="bg-gray-300 text-gray-500 font-medium py-2 px-4 rounded-lg cursor-not-allowed hidden"
                    >
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="h-5 w-5 inline"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                stroke-width="2"
                                d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"
                            />
                        </svg>
                        Flip Camera
                    </button>
                </div>
            </div>
            <div class="mt-8 bg-gray-50 rounded-lg p-4 hidden">
                <h2 class="text-lg font-medium text-gray-700 mb-2">Result</h2>
                <div
                    id="result-text"
                    class="bg-gray-100 p-3 rounded text-gray-700 font-mono text-sm break-all"
                >
                    No QR code scanned yet
                </div>
            </div>
        </div>

        <script>
            // Keep the original tab functionality
            document.addEventListener('DOMContentLoaded', () => {
                const tabBtns = document.querySelectorAll('.tab-btn');
                const tabContents = document.querySelectorAll('.tab-content');

                tabBtns.forEach((btn) => {
                    btn.addEventListener('click', () => {
                        const tabId = btn.getAttribute('data-tab');

                        // Update active tab button
                        tabBtns.forEach((b) => {
                            b.classList.remove(
                                'active',
                                'text-blue-600',
                                'border-blue-500'
                            );
                            b.classList.add('text-gray-500');
                        });
                        btn.classList.add(
                            'active',
                            'text-blue-600',
                            'border-b-2',
                            'border-blue-500'
                        );
                        btn.classList.remove('text-gray-500');

                        // Show selected tab content
                        tabContents.forEach((content) => {
                            if (content.id === tabId) {
                                content.classList.remove('hidden');
                                content.classList.add('block');
                            } else {
                                content.classList.add('hidden');
                                content.classList.remove('block');
                            }
                        });
                    });
                });
            });
        </script>
    </body>
</html>
