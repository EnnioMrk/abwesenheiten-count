<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absence Recommender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="bg-gray-100">
    <div class="min-h-screen bg-gray-100 p-8">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Absence Recommender</h1>
        <div class="flex items-center gap-4">
          <a
            href="/dashboard.html"
            class="bg-indigo-500 text-white px-4 py-2 rounded-md hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            Back to Dashboard
          </a>
          <button
            onclick="logout()"
            class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500"
          >
            Logout
          </button>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <h2 id="recommenderTitle" class="text-xl font-semibold mb-4">
          Absence Recommender
        </h2>
        <div>
          <canvas id="recommenderChart"></canvas>
        </div>
      </div>
    </div>

    <script src="recommender.js"></script>
  </body>
</html>
