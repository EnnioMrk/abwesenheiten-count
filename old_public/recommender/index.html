<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Absence Recommender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/js/settings.js" async></script>
    <script src="/recommender/js/index.js" defer></script>
  </head>
  <body class="bg-gray-100">
    <div class="min-h-screen bg-gray-100 p-8">
      <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Absence Recommender</h1>
        <div class="flex items-center gap-4">
          <a
            href="/dashboard"
            class="bg-indigo-500 text-white px-4 py-2 rounded-md hover:bg-indigo-600 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            Back to Dashboard
          </a>
          <button
            onclick="openSettings()"
            class="bg-white text-gray-700 px-4 py-2 rounded-md border border-gray-300 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
            Settings
          </button>
          <button
            onclick="logout()"
            class="bg-red-500 text-white px-4 py-2 rounded-md hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-500"
          >
            Logout
          </button>
        </div>
      </div>

      <div class="bg-white rounded-lg shadow-md p-6 mb-6">
        <h2 id="recommenderTitle" class="text-xl font-semibold mb-4">
          Absence Recommender
        </h2>
        <div>
          <canvas id="recommenderChart"></canvas>
        </div>
      </div>
    </div>

    <!-- Settings Modal -->
    <div
      id="settingsModal"
      class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden overflow-y-auto h-full w-full"
    >
      <div
        class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white"
      >
        <div class="mt-3">
          <h3 class="text-lg font-medium leading-6 text-gray-900 mb-4">
            Settings
          </h3>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Exclude Reasons</label
            >
            <input
              type="text"
              id="excludeReasons"
              class="w-full p-2 border rounded"
              placeholder="Comma-separated reasons"
            />
          </div>
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2"
              >Absence Reasons</label
            >
            <div id="absenceReasons"></div>
          </div>
          <div class="flex justify-end gap-2">
            <button
              onclick="closeSettings()"
              class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
            >
              Cancel
            </button>
            <button
              onclick="saveSettingsChanges()"
              class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
            >
              Save
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
